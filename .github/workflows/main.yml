name: Push new version to Internal

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to download'
        required: true
        default: '2.0.0'
      asset_pattern:
        description: 'Filename or glob for the AAB asset (example: Tap.Shoot.Win_2.aab)'
        required: true
        default: 'Tap.Shoot.Win_2.aab'
      package_name:
        description: 'Android package name (applicationId)'
        required: true
        default: 'com.tapshootwin.basketball'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # repo secrets
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
      # fastlane / CI helpers
      CI: "true"
      FASTLANE_SKIP_UPDATE_CHECK: "true"
      FASTLANE_OPT_OUT_USAGE: "true"
      FASTLANE_DISABLE_COLORS: "true"
      # package name passed to fastlane
      PACKAGE_NAME: ${{ github.event.inputs.package_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Download AAB from GitHub Release
        shell: bash
        run: |
          mkdir -p build_output
          gh release download "${{ github.event.inputs.tag }}" \
            --pattern "${{ github.event.inputs.asset_pattern }}" \
            --dir build_output

      - name: Ensure AAB was downloaded
        shell: bash
        run: |
          echo "Checking build_output for .aab files..."
          if ! ls build_output/*.aab >/dev/null 2>&1; then
            echo "No AAB found in build_output — check the tag and asset_pattern"
            ls -la build_output || true
            exit 1
          fi
          echo "AAB found:"
          ls -la build_output

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: Install Fastlane
        run: |
          gem install fastlane -v ">= 2.200" --no-document

      - name: Run Fastlane uploading
        shell: bash
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          PACKAGE_NAME: ${{ github.event.inputs.package_name }}
        run: |
          if [ -z "${GOOGLE_PLAY_JSON_KEY}" ]; then
            echo "GOOGLE_PLAY_JSON_KEY secret is empty. Set it in repository secrets."
            exit 1
          fi
          echo "Running fastlane android upload_to_alpha (non-interactive)..."
          fastlane android upload_to_alpha

      - name: Post Checkout
        run: echo "done"
